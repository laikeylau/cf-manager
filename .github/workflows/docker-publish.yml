name: Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '版本号 / tag (例如 1.5.0)，将 checkout 到该 tag 构建'
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Checkout tag
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            git checkout "${TAG}"
            echo "已切换到 tag: ${TAG}"
          else
            echo "::error::Tag ${TAG} 不存在，请先创建该 tag"
            exit 1
          fi

      - name: Set up QEMU for multi-arch builds
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag }}"
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "image=${IMAGE_LOWER}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building image: ${IMAGE_LOWER}:${TAG}"

      - name: Build and push (multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            GIT_COMMIT=${{ github.sha }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Docker 镜像发布完成 ✅" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 项目 | 内容 |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| 镜像 | \`${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Latest | \`${{ steps.meta.outputs.image }}:latest\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 架构 | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 快速使用" >> $GITHUB_STEP_SUMMARY
          echo '> ⚠️ 请在生产环境前将 ENCRYPTION_KEY 和 API_SECRET 修改为自己的强密码' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "docker run -d --name cf-manager -p 3000:3000 \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e ENCRYPTION_KEY=\"cfmgrbest\" \\" >> $GITHUB_STEP_SUMMARY
          echo "  -e API_SECRET=\"cfmgrbest\" \\" >> $GITHUB_STEP_SUMMARY
          echo "  -v ./data:/app/data \\" >> $GITHUB_STEP_SUMMARY
          echo "  --restart unless-stopped \\" >> $GITHUB_STEP_SUMMARY
          echo "  ${{ steps.meta.outputs.image }}:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
