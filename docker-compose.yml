services:
  cf-manager:
    image: cf-manager
    container_name: cf-manager
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        - GIT_COMMIT=${GIT_COMMIT:-}
    restart: unless-stopped
    network_mode: bridge
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - API_SECRET=${API_SECRET:-}
      - PROXY_URL=${PROXY_URL:-}
      - DEMO_ACCOUNT_IDS=${DEMO_ACCOUNT_IDS:-}
      - DB_PATH=/app/data/cf-manager.db
    volumes:
      - ./data:/app/data
